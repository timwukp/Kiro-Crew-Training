<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" width="720" height="600" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="720" height="600" rx="18" fill="#0b1220"/>

  <!-- outer: context window -->
  <rect x="20" y="30" width="680" height="550" rx="14" fill="none" stroke="#334155" stroke-width="1.5"/>
  <text x="360" y="52" text-anchor="middle" fill="#94a3b8" font-size="14">Context Window (~55K tokens, assembled at session start)</text>

  <!-- top row: three session-start layers -->
  <rect x="45" y="72" width="630" height="118" rx="10" fill="none" stroke="#334155" stroke-width="1"/>

  <!-- Preferences -->
  <rect x="70" y="95" width="180" height="72" rx="8" fill="#111a2e" stroke="#6366f1" stroke-width="1.5"/>
  <text x="160" y="122" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="600">Preferences</text>
  <text x="160" y="141" text-anchor="middle" fill="#94a3b8" font-size="11">preferences.md · 4,250 chars</text>
  <text x="160" y="156" text-anchor="middle" fill="#94a3b8" font-size="11">replaced every 30 msgs</text>

  <!-- Projects -->
  <rect x="270" y="95" width="180" height="72" rx="8" fill="#111a2e" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="360" y="122" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="600">Projects</text>
  <text x="360" y="141" text-anchor="middle" fill="#94a3b8" font-size="11">projects.md · 6,400 chars</text>
  <text x="360" y="156" text-anchor="middle" fill="#94a3b8" font-size="11">replaced every 30 msgs</text>

  <!-- Recent History -->
  <rect x="470" y="95" width="180" height="72" rx="8" fill="#111a2e" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="560" y="118" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="600">Recent History</text>
  <text x="560" y="137" text-anchor="middle" fill="#94a3b8" font-size="11">history/*.md · 26,600 chars</text>
  <text x="560" y="152" text-anchor="middle" fill="#94a3b8" font-size="11">5-tier decay (0–365 days)</text>

  <!-- arrow from top group down to semantic -->
  <line x1="360" y1="190" x2="360" y2="232" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Semantic -->
  <rect x="230" y="234" width="260" height="70" rx="8" fill="#111a2e" stroke="#10b981" stroke-width="1.5"/>
  <text x="360" y="260" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="600">Semantic Memory (key-value)</text>
  <text x="360" y="279" text-anchor="middle" fill="#94a3b8" font-size="11">pref.* project.* user.* · 12,000 chars</text>
  <text x="360" y="294" text-anchor="middle" fill="#94a3b8" font-size="11">hybrid 0.6×vec + 0.4×kw · confidence ≥0.8</text>

  <line x1="360" y1="304" x2="360" y2="344" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Episodic -->
  <rect x="230" y="346" width="260" height="70" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="360" y="372" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="600">Episodic Memory (past events)</text>
  <text x="360" y="391" text-anchor="middle" fill="#94a3b8" font-size="11">FAISS vector search + time-decay · top-8</text>
  <text x="360" y="406" text-anchor="middle" fill="#94a3b8" font-size="11">3,000 chars · max 10,000 entries</text>

  <line x1="360" y1="416" x2="360" y2="456" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Lessons -->
  <rect x="230" y="458" width="260" height="70" rx="8" fill="#111a2e" stroke="#ec4899" stroke-width="1.5"/>
  <text x="360" y="484" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="600">Lessons (learned corrections)</text>
  <text x="360" y="503" text-anchor="middle" fill="#94a3b8" font-size="11">lesson.* keys · confidence 1.0 · max 50</text>
  <text x="360" y="518" text-anchor="middle" fill="#94a3b8" font-size="11">user-explicit always wins</text>

  <!-- caption -->
  <text x="360" y="560" text-anchor="middle" fill="#64748b" font-size="11">Six independent memory layers · redrawn from kiro.dev/docs/crew/features/memory/</text>
</svg>
